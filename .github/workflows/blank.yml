name: SQL Server CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-sql-script:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: C12MB@mpho
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P  C12MB@mpho -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc

      - name: Run Race_Day_Database.sql
        run: |
          # -I enables GO batch separators
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P  C12MB@mpho -I -i Documents/Race_Day_Database.sql

      - name: Verify tables
        run: |
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P  C12MB@mpho -Q "USE RaceDayDB; SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES;"
