
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./Race_Day/Race_Day/Race_Day.csproj
      
    - name: Build
      run: dotnet build ./Race_Day/Race_Day/Race_Day.csproj --no-restore
      
    - name: Test
      run: dotnet test ./Race_Day/Race_Day.Test/Race_Day.Test.csproj --no-restore --verbosity normal
