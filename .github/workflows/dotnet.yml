name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    # 1. Restore the Main App
    - name: Restore Main Project
      run: dotnet restore ./Race_Day/Race_Day/Race_Day.csproj
      
    # 2. Restore the Test Project (This fixes the error in your text)
    - name: Restore Test Project
      run: dotnet restore ./Race_Day/Race_Day.Test/Race_Day.Test.csproj
      
    # 3. Build the Main App
    - name: Build Main Project
      run: dotnet build ./Race_Day/Race_Day/Race_Day.csproj --no-restore
      
    # 4. Test the Test Project
    - name: Test
      run: dotnet test ./Race_Day/Race_Day.Test/Race_Day.Test.csproj --no-restore --verbosity normal
