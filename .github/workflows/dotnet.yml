name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore solution
      run: dotnet restore ./RaceDay/RaceDay.sln

    - name: Build solution
      run: dotnet build ./RaceDay/RaceDay.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test ./RaceDay/RaceDay.Tests/RaceDay.Tests.csproj --no-restore --verbosity normal
