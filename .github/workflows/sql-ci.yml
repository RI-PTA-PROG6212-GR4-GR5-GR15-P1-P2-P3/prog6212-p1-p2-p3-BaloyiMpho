name: Race Day Database CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-database:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server in Docker
        run: |
          docker run -d \
            --name sqlserver \
            -e 'ACCEPT_EULA=Y' \
            -e 'MSSQL_SA_PASSWORD=YourStrong!Passw0rd' \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2019-latest

      - name: Wait for SQL Server to be ready
        run: |
          echo "Waiting for SQL Server to start..."
          for i in {1..60}; do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q "SELECT 1" &>/dev/null; then
              echo "SQL Server is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting..."
            sleep 5
          done
          echo "SQL Server failed to start"
          docker logs sqlserver
          exit 1

      - name: Create Database
        run: |
          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'YourStrong!Passw0rd' -C \
            -Q "CREATE DATABASE RaceDayDB;"
          echo "Database created"

      - name: Run Race Day Database Script
        run: |
          echo "Running Race_Day_Database.sql..."
          docker exec -i sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d RaceDayDB \
            -I -i /dev/stdin < Documents/Race_Day_Database.sql
          echo "Script executed successfully"

      - name: Verify Tables
        run: |
          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d RaceDayDB \
            -Q "SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;"

      - name: Verify Sample Data
        run: |
          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'YourStrong!Passw0rd' -C -d RaceDayDB \
            -Q "
            SELECT 'Users' AS TableName, COUNT(*) AS Count FROM [USER]
            UNION ALL
            SELECT 'Roles', COUNT(*) FROM ROLE
            UNION ALL
            SELECT 'Events', COUNT(*) FROM EVENT
            UNION ALL
            SELECT 'Categories', COUNT(*) FROM CATEGORY
            UNION ALL
            SELECT 'Enrolments', COUNT(*) FROM ENROLMENT
            UNION ALL
            SELECT 'Participants', COUNT(*) FROM PARTICIPANT_EVENT;"

      - name: Show SQL Server logs if failure
        if: failure()
        run: docker logs sqlserver
